<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hone · Faux Fragment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    .desk {
      display: grid;
      gap: 20px;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }

    .desk__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .desk__head h1 { font-size: 22px; letter-spacing: -0.02em; }
    .desk__head small { color: var(--text-muted); font-weight: 500; }

    .card {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .card h2 { font-size: 15px; margin-bottom: 12px; }

    .pairing {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 24px;
      align-items: center;
    }

    @media (max-width: 640px) {
      .pairing { grid-template-columns: 1fr; }
    }

    .qr {
      display: grid;
      place-items: center;
      width: 200px;
      height: 200px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
    }

    .qr:not(:empty) { border: 0; }

    .field { display: grid; gap: 4px; margin-bottom: 14px; }
    .field span { color: var(--text-muted); font-size: 13px; font-weight: 500; }
    .field code, .field a { font-size: 13px; word-break: break-all; }
    .field a { color: var(--accent); }

    .status[data-state="online"] .status__dot { background: var(--success); }
    .status[data-state="connecting"] .status__dot { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18); }
    .status[data-state="offline"] .status__dot { background: var(--danger); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18); }

    .pairing .btn { width: auto; min-height: 44px; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .gallery:empty::before {
      content: "Aucune photo reçue pour l'instant.";
      color: var(--text-muted);
      font-size: 14px;
    }

    .shot {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      animation: pop-in 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .shot img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; }

    .shot figcaption {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .shot a { color: var(--accent); font-weight: 600; }

    .log {
      max-height: 240px;
      overflow: auto;
      padding: 12px;
      border-radius: 10px;
      background: #16161a;
      color: #d4d4dc;
      font: 12px/1.6 ui-monospace, "Cascadia Code", Consolas, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main class="desk">

    <header class="desk__head">
      <h1>Faux Fragment <small>· page de test</small></h1>
      <span class="status" id="relay-status" data-state="offline">
        <span class="status__dot" aria-hidden="true"></span>
        <span id="relay-status-text">Relais déconnecté</span>
      </span>
    </header>

    <section class="card pairing">
      <div class="qr" id="qr"></div>
      <div>
        <div class="field">
          <span>Session</span>
          <code id="session-id">—</code>
        </div>
        <div class="field">
          <span>Lien téléphone</span>
          <a id="phone-link" target="_blank" rel="noopener">—</a>
        </div>
        <div class="field">
          <span>Téléphone</span>
          <strong id="phone-status">Non connecté</strong>
        </div>
        <button class="btn btn--ghost" id="new-session" type="button">Nouvelle session</button>
      </div>
    </section>

    <section class="card">
      <h2>Photos reçues</h2>
      <div class="gallery" id="gallery"></div>
    </section>

    <section class="card">
      <h2>Journal</h2>
      <pre class="log" id="log"></pre>
    </section>

  </main>
  <script src="desktop.js" defer></script>
</body>
</html>
